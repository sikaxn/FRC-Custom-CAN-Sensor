<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>IM Assistant</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <div class="container menu" style="padding-bottom: 110px;">
    <h1>IM Assistant</h1>
    <div id="app-version" style="font-size: 12px; color: #666; margin-top: -6px;">Version: loading...</div>

    <button onclick="nav.go('update_firmware.html')">
      Update Firmware
    </button>

    <button onclick="nav.go('can_device_number.html')">
      CAN Device Number Setting
    </button>

    <button onclick="nav.go('best_json_editor.html')">
      BEST Battery Tag JSON Editor
    </button>

    <button onclick="nav.go('rfid_battery_tag_reader.html')">
      RFID Battery Tag Reader
    </button>

    <button onclick="nav.go('rfid_tag_tools.html')">
      RFID Tag Tools
    </button>
  </div>

  <div style="position: fixed; left: 0; right: 0; bottom: 0; background: #f4f4f4; border-top: 1px solid #ddd; padding: 10px 20px;">
    <div class="container" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <strong style="min-width: 80px;">COM Port</strong>
      <select id="port-select" style="flex: 1; min-width: 180px; padding: 8px;"></select>
      <button id="btnRefreshPorts" type="button">Refresh</button>
      <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px;">
        <input type="checkbox" id="toggleMenuBar" />
        Show menu bar (debug)
      </label>
      <span style="color: #555; font-size: 12px;">If you're experiencing connection issues, check if another app (like Arduino IDE) is using the serial port.</span>
    </div>
  </div>

  <script>
    const portSelect = document.getElementById("port-select");
    const btnRefreshPorts = document.getElementById("btnRefreshPorts");
    const toggleMenuBar = document.getElementById("toggleMenuBar");
    let portList = [];

    function portMatches(pref, port) {
      if (!pref) return false;
      if (pref.serialNumber && port.serialNumber) {
        return pref.serialNumber === port.serialNumber;
      }
      if (pref.path && port.path) {
        return pref.path === port.path;
      }
      if (pref.vendorId && pref.productId && port.vendorId && port.productId) {
        return (
          pref.vendorId === port.vendorId && pref.productId === port.productId
        );
      }
      return false;
    }

    function portLabel(port) {
      const parts = [];
      if (port.path) parts.push(port.path);
      if (port.friendlyName) {
        parts.push(port.friendlyName);
      } else if (port.manufacturer) {
        parts.push(port.manufacturer);
      } else if (port.pnpId) {
        parts.push(port.pnpId);
      }
      return parts.join(" - ") || "Unknown port";
    }

    async function loadPorts() {
      if (!window.serial?.listPorts) {
        return;
      }
      try {
        portList = await window.serial.listPorts();
        const preferred = await window.serial.getPreferred();

        portSelect.innerHTML = "";
        const optAuto = document.createElement("option");
        optAuto.value = "";
        optAuto.textContent = "None";
        portSelect.appendChild(optAuto);

        portList.forEach((port, idx) => {
          const opt = document.createElement("option");
          opt.value = String(idx);
          opt.textContent = portLabel(port);
          portSelect.appendChild(opt);
        });

        let selectedIndex = 0;
        if (preferred) {
          const matchIndex = portList.findIndex((p) => portMatches(preferred, p));
          if (matchIndex >= 0) selectedIndex = matchIndex + 1;
        }
        portSelect.selectedIndex = selectedIndex;
      }
      catch {}
    }

    portSelect.addEventListener("change", async () => {
      if (portSelect.value === "") {
        await window.serial.clearPreferred();
        return;
      }
      const idx = Number(portSelect.value);
      const selected = portList[idx];
      if (!selected) return;
      await window.serial.setPreferred({
        path: selected.path || "",
        serialNumber: selected.serialNumber || "",
        displayName: selected.displayName || "",
        vendorId: selected.vendorId || "",
        productId: selected.productId || "",
        usbVendorId: selected.usbVendorId || "",
        usbProductId: selected.usbProductId || "",
      });
    });

    btnRefreshPorts.addEventListener("click", loadPorts);

    loadPorts();

    async function loadUiPrefs() {
      if (!window.ui?.setAutoHideMenuBar) return;
      toggleMenuBar.checked = false;
      await window.ui.setAutoHideMenuBar(true);
    }

    toggleMenuBar.addEventListener("change", async () => {
      if (!window.ui?.setAutoHideMenuBar) return;
      await window.ui.setAutoHideMenuBar(!toggleMenuBar.checked);
    });

    loadUiPrefs();

    async function loadVersion() {
      if (!window.app?.getVersion) return;
      const el = document.getElementById("app-version");
      if (!el) return;
      try {
        const version = await window.app.getVersion();
        const isExperimental = /b$/i.test(version);
        if (isExperimental) {
          el.style.color = "#c00";
          el.textContent = `Version: ${version} (experimental build)`;
        } else {
          el.style.color = "#666";
          el.textContent = `Version: ${version}`;
        }
      } catch {
        el.textContent = "Version: unknown";
      }
    }

    loadVersion();
  </script>
  <script src="../assets/lockdown.js"></script>
</body>
</html>
